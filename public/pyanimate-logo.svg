<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="grad-stem" x1="50" y1="10" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff6535"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="grad-loop" x1="20" y1="20" x2="90" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#080c12"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <g filter="url(#glow)">
    <path d="M32 30 C85 30 85 64 32 64" stroke="url(#grad-loop)" stroke-width="16" stroke-linecap="round"/>
    <path d="M32 20 L32 80" stroke="url(#grad-stem)" stroke-width="16" stroke-linecap="round"/>
    <polygon points="43,38 56,47 43,56" fill="#080c12"/>
    <polygon points="46,41 53,47 46,53" fill="#ffffff"/>
  </g>
</svg>
